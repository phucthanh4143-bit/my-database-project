<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Feedback - Google Sheets Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Navigation */
        .nav {
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-5px);
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        /* Form Card */
        .form-card, .list-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .form-card h2, .list-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-left: 4px solid #4facfe;
            padding-left: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-top: 10px;
        }

        /* Feedback List */
        .feedback-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #4facfe;
        }

        .feedback-name {
            font-weight: bold;
            color: #333;
            font-size: 1.1rem;
        }

        .feedback-email {
            color: #666;
            font-size: 0.85rem;
            margin: 5px 0;
        }

        .feedback-message {
            color: #555;
            margin: 10px 0;
            line-height: 1.5;
        }

        .feedback-time {
            color: #999;
            font-size: 0.75rem;
            text-align: right;
        }

        /* Alert Messages */
        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .form-card, .list-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <div class="nav">
            <a href="index.html" class="back-btn">
                ← Quay lại Dashboard
            </a>
        </div>

        <!-- Header -->
        <div class="header">
            <h1>📊 Form Góp ý Khóa Học</h1>
            <p>Dữ liệu được lưu trữ trên Google Sheets | Gửi và xem ngay lập tức</p>
        </div>

        <!-- Alert Message -->
        <div id="alert" class="alert"></div>

        <!-- Form Section -->
        <div class="form-card">
            <h2>✏️ Gửi góp ý của bạn</h2>
            <form id="feedbackForm">
                <div class="form-group">
                    <label for="name">Họ và tên *</label>
                    <input type="text" id="name" name="name" required placeholder="Nhập họ tên của bạn">
                </div>
                
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>
                
                <div class="form-group">
                    <label for="message">Nội dung góp ý *</label>
                    <textarea id="message" name="message" required placeholder="Chia sẻ ý kiến của bạn về khóa học..."></textarea>
                </div>
                
                <button type="submit" class="btn">📤 Gửi góp ý</button>
            </form>
        </div>

        <!-- List Section -->
        <div class="list-card">
            <h2>📋 Danh sách góp ý</h2>
            <button id="loadFeedbackBtn" class="btn btn-secondary">🔄 Tải danh sách góp ý</button>
            <div id="feedbackList" style="margin-top: 20px;">
                <div class="empty-state">
                    <p>👆 Nhấn nút trên để tải danh sách góp ý từ Google Sheets</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== THAY URL NÀY BẰNG URL THẬT TỪ GOOGLE APPS SCRIPT ====================
        const GOOGLE_SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbw7FP74q2vLXAtrJNfQ638jc5bOP0H9Gis8aMt3GowoA_xlXcpRFO3zVIqiCU-nwaemhQ/exec';
        // ========================================================================================

        // DOM elements
        const form = document.getElementById('feedbackForm');
        const alertDiv = document.getElementById('alert');
        const loadBtn = document.getElementById('loadFeedbackBtn');
        const feedbackListDiv = document.getElementById('feedbackList');

        // Helper: Hiển thị thông báo
        function showAlert(message, type = 'success') {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            setTimeout(() => {
                alertDiv.className = 'alert';
                alertDiv.textContent = '';
            }, 5000);
        }

        // Helper: Format date
        function formatDate(dateString) {
            if (!dateString) return 'Không rõ thời gian';
            try {
                const date = new Date(dateString);
                return date.toLocaleString('vi-VN');
            } catch (e) {
                return dateString;
            }
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Function: Gửi feedback lên Google Sheets
        async function submitFeedback(name, email, message) {
            const response = await fetch(GOOGLE_SHEETS_API_URL, {
                method: 'POST',
                mode: 'no-cors', // Bắt buộc với Google Apps Script
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name, email, message })
            });
            
            // Với mode: 'no-cors', không thể đọc response
            // Giả định thành công nếu không có lỗi network
            return { success: true };
        }

        // Function: Tải danh sách feedback từ Google Sheets
        async function loadFeedback() {
            // Hiển thị loading
            feedbackListDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Đang tải dữ liệu từ Google Sheets...</p>
                </div>
            `;
            
            try {
                const response = await fetch(`${GOOGLE_SHEETS_API_URL}?t=${Date.now()}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success && result.data) {
                    displayFeedback(result.data);
                } else {
                    throw new Error(result.error || 'Không thể tải dữ liệu');
                }
            } catch (error) {
                console.error('Lỗi:', error);
                feedbackListDiv.innerHTML = `
                    <div class="empty-state">
                        <p>❌ Lỗi tải dữ liệu: ${error.message}</p>
                        <p style="margin-top: 10px; font-size: 0.9rem;">Kiểm tra lại URL Google Apps Script và đảm bảo đã deploy thành công!</p>
                    </div>
                `;
                showAlert('Không thể tải danh sách góp ý. Vui lòng kiểm tra lại!', 'error');
            }
        }

        // Function: Hiển thị danh sách feedback
        function displayFeedback(feedbacks) {
            if (!feedbacks || feedbacks.length === 0) {
                feedbackListDiv.innerHTML = `
                    <div class="empty-state">
                        <p>📭 Chưa có góp ý nào. Hãy là người đầu tiên gửi góp ý!</p>
                    </div>
                `;
                return;
            }
            
            const html = feedbacks.map(fb => `
                <div class="feedback-item">
                    <div class="feedback-name">${escapeHtml(fb.name)}</div>
                    <div class="feedback-email">📧 ${escapeHtml(fb.email)}</div>
                    <div class="feedback-message">💬 ${escapeHtml(fb.message)}</div>
                    <div class="feedback-time">🕒 ${formatDate(fb.timestamp)}</div>
                </div>
            `).join('');
            
            feedbackListDiv.innerHTML = html;
            showAlert(`Đã tải ${feedbacks.length} góp ý thành công!`, 'success');
        }

        // Handle form submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();
            
            if (!name || !email || !message) {
                showAlert('Vui lòng điền đầy đủ thông tin!', 'error');
                return;
            }
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('Email không hợp lệ!', 'error');
                return;
            }
            
            // Disable button và hiển thị loading
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Đang gửi...';
            submitBtn.disabled = true;
            
            try {
                await submitFeedback(name, email, message);
                showAlert('Gửi góp ý thành công! Cảm ơn bạn đã đóng góp.', 'success');
                form.reset();
                
                // Tự động tải lại danh sách sau khi gửi thành công
                setTimeout(() => {
                    loadFeedback();
                }, 1000);
                
            } catch (error) {
                console.error('Lỗi gửi:', error);
                showAlert('Có lỗi xảy ra khi gửi góp ý. Vui lòng thử lại!', 'error');
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
        
        // Handle load feedback button
        loadBtn.addEventListener('click', loadFeedback);
        
        // Kiểm tra URL đã được cấu hình chưa
        if (GOOGLE_SHEETS_API_URL.includes('YOUR_SCRIPT_ID')) {
            feedbackListDiv.innerHTML = `
                <div class="empty-state">
                    <p>⚠️ <strong>Chưa cấu hình URL Google Apps Script!</strong></p>
                    <p>Vui lòng:</p>
                    <ol style="text-align: left; display: inline-block; margin-top: 10px;">
                        <li>Tạo Google Sheets và deploy Apps Script</li>
                        <li>Copy URL và thay vào biến GOOGLE_SHEETS_API_URL</li>
                    </ol>
                </div>
            `;
        }
        
        // Auto load feedback when page loads (nếu đã cấu hình URL)
        if (!GOOGLE_SHEETS_API_URL.includes('YOUR_SCRIPT_ID')) {
            loadFeedback();
        }
    </script>
</body>
</html>
